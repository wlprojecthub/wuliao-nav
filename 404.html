<!DOCTYPE html>
<html lang="zh-CN">
<head>

<body class="error-page">

        <div class="error-spark error-spark-one" aria-hidden="true">✦</div>

            <span>

            </span>
        </a>

        <section class="error-card" aria-labelledby="errorTitle">
            <div class="error-visual" aria-hidden="true">
                <span class="error-orbit"></span>
                <span class="error-moon">☾</span>
                <span class="error-code">404</span>
                <span class="error-star error-star-one">✦</span>

                    <a class="error-button error-button-primary" href="/">
                        <span>返回首页</span>
                        <span aria-hidden="true">→</span>
                    </a>
                    <button class="error-button error-button-secondary" type="button" onclick="history.length > 1 ? history.back() : location.href = '/'">
                        <span aria-hidden="true">←</span>
                        <span>返回上一页</span>
                    </button>
                </div>
            </div>

        <nav class="error-shortcuts" aria-label="常用分类快捷入口">
