# Include these locations inside the server block for acgnnav.top.
# The HTML entry point must revalidate so it can publish new asset hashes.
location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    expires -1;
}

location = / {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    expires -1;
}

# Assets use content hashes in the query string. Re-running the release script
# changes the URL when CSS, JavaScript, or site data changes.
location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    expires 1y;
}
