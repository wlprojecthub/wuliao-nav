# Include these locations inside the server block for acgnnav.top.
# The HTML entry point must revalidate so it can publish new asset hashes.
location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    expires -1;
}

location = / {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    expires -1;
}

# CSS and JavaScript URLs use content hashes in the query string. Re-running
# the release script changes the URL when code or site data changes.
location /assets/css/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    expires 1y;
}

location /assets/js/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    expires 1y;
}

# Images keep stable filenames, so allow clients to revalidate updates.
location /assets/img/ {
    add_header Cache-Control "public, max-age=604800, must-revalidate" always;
    expires 7d;
}
